name: CI

on:
  push:
    branches: [main, migrate/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle
      - name: Backend tests
        run: ./gradlew :backend:test --no-daemon

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle
      - name: CLI compile
        run: ./gradlew :cli:jar --no-daemon

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle
      - name: GUI compile
        run: ./gradlew :gui:compileJava --no-daemon

  postgres-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riseup
          POSTGRES_PASSWORD: riseup
          POSTGRES_DB: riseup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riseup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: gradle
      - name: Boot against Postgres
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/riseup
          DATABASE_USER: riseup
          DATABASE_PASSWORD: riseup
          DATABASE_DRIVER: org.postgresql.Driver
          ENABLE_SCHEDULER: "false"
        run: ./gradlew :backend:test --tests com.riseup.HealthIT --no-daemon
