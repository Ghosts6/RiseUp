[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riseup"
version = "0.2.0"
description = "RiseUp - intelligent alarm and task reminder system (backend + CLI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "httpx>=0.26",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.1",
    "flake8>=7.0",
    "mypy>=1.8",
]

[project.scripts]
riseup = "riseup_cli.app:main"
riseup-server = "riseup.main:run"

[tool.setuptools.packages.find]
include = ["riseup*", "riseup_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
