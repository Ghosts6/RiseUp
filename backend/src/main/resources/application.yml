spring:
  application:
    name: riseup
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/riseup;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8000}

riseup:
  version: 0.2.0
  environment: ${ENVIRONMENT:development}
  demo-token: ${DEMO_TOKEN:dev-token}
  require-auth: ${REQUIRE_AUTH:false}
  enable-scheduler: ${ENABLE_SCHEDULER:true}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8000}
  secret-key: ${SECRET_KEY:change-me}
  verification-timeout-seconds: ${VERIFICATION_TIMEOUT_SECONDS:120}
  checkin-response-minutes: ${CHECKIN_RESPONSE_MINUTES:5}
  escalation-response-seconds: ${ESCALATION_RESPONSE_SECONDS:30}
  reminder-retry-minutes: ${REMINDER_RETRY_MINUTES:2}
  reminder-escalation-minutes: ${REMINDER_ESCALATION_MINUTES:5}
  reminder-final-minutes: ${REMINDER_FINAL_MINUTES:15}
  reminder-missed-minutes: ${REMINDER_MISSED_MINUTES:25}
  camera-available: ${CAMERA_AVAILABLE:true}
  openai-api-key: ${OPENAI_API_KEY:}
  claude-api-key: ${CLAUDE_API_KEY:}
  claude-model: ${CLAUDE_MODEL:claude-sonnet-4-5}
  openai-model: ${OPENAI_MODEL:gpt-4o}
  llm-escalation-provider: ${LLM_ESCALATION_PROVIDER:claude}
  llm-parse-provider: ${LLM_PARSE_PROVIDER:openai}
  llm-prioritize-provider: ${LLM_PRIORITIZE_PROVIDER:claude}
  llm-recommend-provider: ${LLM_RECOMMEND_PROVIDER:claude}
  mock-llm-mode: ${MOCK_LLM_MODE:normal}
  twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
  twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
  twilio-phone-number: ${TWILIO_PHONE_NUMBER:}
  alexa-api-key: ${ALEXA_API_KEY:}
  firebase-api-key: ${FIREBASE_API_KEY:}
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-username: ${SMTP_USERNAME:}
  smtp-password: ${SMTP_PASSWORD:}
  smtp-from: ${SMTP_FROM:}
  mock-tool-failures: ${MOCK_TOOL_FAILURES:}
  redis-url: ${REDIS_URL:}

logging:
  level:
    com.riseup: INFO
