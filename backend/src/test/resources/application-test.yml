spring:
  datasource:
    url: jdbc:h2:mem:riseup_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

riseup:
  demo-token: test-token
  require-auth: false
  enable-scheduler: false
  mock-llm-mode: normal
  camera-available: true
