services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riseup
      POSTGRES_PASSWORD: riseup
      POSTGRES_DB: riseup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riseup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://riseup:riseup@postgres:5432/riseup
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:8000
      DEMO_TOKEN: ${DEMO_TOKEN:-dev-token}
      # Optional: leave empty to use the offline mock adapters.
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ALEXA_API_KEY: ${ALEXA_API_KEY:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_TOKEN: ${DEMO_TOKEN:-dev-token}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
